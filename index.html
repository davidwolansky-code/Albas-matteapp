<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Albas mattestudio</title>
<style>
:root{--paper:#fffdf8;--ink:#23211d;--soft:#5f5b52;--line:#e3ded2;--panel:#f4f0e6;--accent:#2f6fe0;--orange:#f08a1f;--good:#17703c;--pen:#1f2a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--panel);color:var(--ink);font:16px/1.4 "Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;overscroll-behavior:none}
body{overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 4px;gap:8px}
h1{font-size:18px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hb{display:flex;gap:6px;align-items:center;flex:none}
.pill{white-space:nowrap;flex:none;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
button{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;min-height:48px;padding:0 12px;cursor:pointer;touch-action:manipulation;font-weight:600}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
#b-snd,#b-home{width:48px;padding:0;font-size:20px}#b-home[hidden]{display:none}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:4px 10px 10px}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px}
#panel{text-align:center}
#panel h2{margin:0 0 4px;font-size:22px}
#panel p{margin:4px 0;color:var(--soft);font-size:16px}
#panel p.msg{color:var(--ink);font-size:18px;font-weight:600}
#panel p.err{color:#8a1c1c;font-weight:600}
.eq{font-size:46px;font-weight:800;letter-spacing:1px;margin:2px 0;font-variant-numeric:tabular-nums}
.eq small{font-size:46px;color:var(--accent)}
.chips{display:flex;justify-content:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.chip{min-width:60px;min-height:68px;font-size:36px;font-weight:800;border-width:3px;padding:0 10px}
.chip.sel{border-color:var(--ink);background:#fff3c4}
.chip.low{border-style:dashed;border-color:#b26a00}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.keys button{min-height:50px;font-size:22px;font-weight:700;padding:0}
.keys .wide{grid-column:span 2;font-size:16px}.keys .rest{grid-column:span 3;font-size:16px}.keys [data-k=ok]{font-size:16px}
.opts{display:flex;gap:6px;margin-top:8px}.opts button{flex:1;font-size:15px}
.opts button.on{border-color:var(--ink);background:#fff3c4}
#vis{display:block;width:100%;height:clamp(130px,26vh,240px);background:#fff;border:2px solid var(--line);border-radius:18px;flex:none}
#vis[hidden]{display:none}
#padwrap{position:relative;flex:1;min-height:150px;border:2px solid var(--line);border-radius:18px;background:var(--paper);overflow:hidden}
#padwrap[hidden]{display:none}
#pad{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#actions{display:flex;flex-direction:column;gap:6px;flex:none}
#actions[hidden]{display:none}
.row{display:flex;gap:6px}.row button{flex:1}
.big{min-height:58px;font-size:19px;font-weight:700}
.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.good{background:var(--good);color:#fff;border-color:var(--good)}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (orientation:landscape) and (max-height:520px){
 #app{max-width:none}
 main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;gap:6px 10px}
 #panel{grid-column:1;grid-row:1}
 #vis{grid-column:1;grid-row:2/4;height:100%;min-height:0}
 #panel p.msg{font-size:15px}#panel h2{font-size:18px}
 #padwrap{grid-column:2;grid-row:1/3}
 #actions{grid-column:2;grid-row:3}
 .eq,.eq small{font-size:34px}.chip{min-height:54px;font-size:28px}
 h1{font-size:16px}
}
#tip{position:fixed;inset:0;z-index:8;background:rgba(20,25,50,.55);display:flex;align-items:center;justify-content:center;padding:10px}
#tip[hidden]{display:none}
.tipcard{width:min(100%,460px);max-height:100%;overflow:auto;text-align:center}
.tipcard h2{margin:0 0 4px;font-size:21px}
.tipcard p{margin:6px 0;font-size:16px;color:var(--soft)}
.tipcard p.how{color:var(--ink)}
.tipcard p.tmsg{color:var(--ink);font-weight:700;font-size:18px;min-height:26px}
#tcv{width:100%;height:clamp(170px,30vh,260px);display:block;border:2px solid var(--line);border-radius:14px;background:var(--paper);touch-action:none}
.tipcard .row{margin-top:8px}
@media (orientation:landscape) and (max-height:520px){
 .tipcard{width:min(100%,780px);display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;align-content:start;padding:10px 14px}
 .tipcard h2{grid-column:1/3;font-size:18px}
 #tcv{grid-column:2;grid-row:2/7;height:calc(100vh - 110px);max-height:300px;align-self:start}
 .tipcard p{font-size:14px;margin:2px 0;text-align:left}
 .tipcard .row,.tipcard .big{grid-column:1}
 .tipcard .big{margin-top:6px!important;min-height:48px}
}
@media (prefers-reduced-motion:reduce){#tcv{}}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<div id="app">
 <header><h1>🧮 Albas mattestudio</h1><div class="hb"><span class="pill" id="stars" aria-label="Rätt på första försöket">⭐ 0</span><button id="b-home" aria-label="Till startsidan" hidden>🏠</button><button id="b-snd" aria-label="Ljud på" aria-pressed="true">🔊</button></div></header>
 <main>
  <section id="panel" class="card" aria-live="polite"></section>
  <canvas id="vis" hidden role="img" aria-label="Prickar som visar uträkningen"></canvas>
  <div id="padwrap" hidden><canvas id="pad" role="img" aria-label="Skrivyta. Skriv med fingret."></canvas></div>
  <div id="actions" hidden></div>
 </main>
 <canvas id="fx"></canvas>
 <div id="tip" hidden role="dialog" aria-modal="true" aria-labelledby="tip-title">
  <div class="card tipcard">
   <h2 id="tip-title"></h2>
   <p id="tip-look"></p>
   <canvas id="tcv" role="img" aria-label="Så här ritar man tecknet, steg för steg"></canvas>
   <p class="how" id="tip-how"></p>
   <p class="tmsg" id="tip-msg" aria-live="polite"></p>
   <div class="row" id="tip-act"></div>
   <button class="big main" data-t="close" style="width:100%;margin-top:8px">Fortsätt</button>
  </div>
 </div>
</div>

/* ===== Handskriftsigenkänning (körs i telefonen) ===== */
const GN=20,FP=14.5,HW=0.9,EPS=0.06,LAB='0123456789+-=';
function mkNet(M){
 const L=[];
 for(let l=0;l<M.W.length;l++){
  const bin=atob(M.W[l]),n=bin.length,w=new Float32Array(n),sc=M.S[l];
  for(let i=0;i<n;i++){let v=bin.charCodeAt(i);if(v>127)v-=256;w[i]=v*sc}
  L.push({w,b:Float32Array.from(M.B[l]),i:M.dims[l],o:M.dims[l+1]});
 }
 return L;
}
const NET=mkNet(MODEL),NET2=mkNet(MIRM);
function forward(net,x){
 let h=x;
 for(let l=0;l<net.length;l++){
  const{w,b,i:ni,o}=net[l],out=new Float32Array(o);
  for(let j=0;j<o;j++){let s=b[j];const off=j*ni;for(let k=0;k<ni;k++)s+=w[off+k]*h[k];out[j]=l<net.length-1?(s>0?s:0):s}
  h=out;
 }
 return h;
}
function glyphFeatures(strokes){
 let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
 for(const s of strokes)for(const p of s){if(p[0]<mnx)mnx=p[0];if(p[0]>mxx)mxx=p[0];if(p[1]<mny)mny=p[1];if(p[1]>mxy)mxy=p[1]}
 const w=mxx-mnx,h=mxy-mny,m=Math.max(w,h,1e-6),sc=FP/m,cx=(mnx+mxx)/2,cy=(mny+mxy)/2;
 const P=[];
 for(const s of strokes){
  const q=s.map(p=>[(p[0]-cx)*sc+GN/2,(p[1]-cy)*sc+GN/2]);
  if(q.length===1){P.push(q[0][0],q[0][1]);continue}
  for(let i=0;i<q.length-1;i++){
   const a=q[i],b=q[i+1],d=Math.hypot(b[0]-a[0],b[1]-a[1]),k=Math.max(1,Math.ceil(d/0.5));
   for(let j=0;j<k;j++){const t=j/k;P.push(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t)}
  }
  const l=q[q.length-1];P.push(l[0],l[1]);
 }
 const f=new Float32Array(GN*GN+1);
 for(let py=0;py<GN;py++)for(let px=0;px<GN;px++){
  const X=px+.5,Y=py+.5;let best=1e9;
  for(let i=0;i<P.length;i+=2){const dx=X-P[i],dy=Y-P[i+1],d=dx*dx+dy*dy;if(d<best)best=d}
  f[py*GN+px]=Math.max(0,Math.min(1,HW+.5-Math.sqrt(best)));
 }
 const e=EPS*Math.max(w,h,1e-6);
 f[GN*GN]=Math.max(-3,Math.min(3,Math.log((w+e)/(h+e))))/3;
 return f;
}
function netProbs(x){
 const h=forward(NET,x);
 let mx=-1e9;for(const v of h)if(v>mx)mx=v;
 let sum=0;const p=new Float32Array(h.length);for(let i=0;i<h.length;i++){p[i]=Math.exp(h[i]-mx);sum+=p[i]}
 for(let i=0;i<p.length;i++)p[i]/=sum;return p;
}
function mirrorProb(strokes,d){
 const f=glyphFeatures(strokes),x=new Float32Array(411);x.set(f);x[401+d]=1;
 return 1/(1+Math.exp(-forward(NET2,x)[0]));
}
function strokeInfo(s){let a=1e9,b=-1e9,c=1e9,d=-1e9,len=0;for(let i=0;i<s.length;i++){const p=s[i];if(p[0]<a)a=p[0];if(p[0]>b)b=p[0];if(p[1]<c)c=p[1];if(p[1]>d)d=p[1];if(i)len+=Math.hypot(p[0]-s[i-1][0],p[1]-s[i-1][1])}return{s,minx:a,maxx:b,miny:c,maxy:d,len}}
function minDist(a,b){
 const pa=dens(a),pb=dens(b);let m=1e9;
 for(const p of pa)for(const q of pb){const d=(p[0]-q[0])*(p[0]-q[0])+(p[1]-q[1])*(p[1]-q[1]);if(d<m)m=d}

  st='copy';helped=true;msg='Vi räknar tillsammans!';V={a:A,b:B,op:OP,k:0,label:A};render();clearPad('Skriv svaret här');
  playCount(()=>{if(st==='copy'){msg='Det blev '+ANS+'. Skriv '+ANS+' med fingret!';$('#panel').querySelector('.msg').textContent=msg}});
 }else{
  stopAnim();st='reveal';helped=true;msg='Det blev '+ANS+'. Det är okej, nu vet du. Vi tar en till!';V={a:A,b:B,op:OP,k:B,label:ANS};render();S.done=S.done;save();
 }
}
function toRight(){
 stopAnim();
 const first=attempts===0;if(first)S.stars++;S.done++;save();
 st='right';msg=first?'Rätt! ⭐':(helped?'Rätt! Bra jobbat!':'Rätt, nu fick du det!');
 V={a:A,b:B,op:OP,k:B,label:ANS};render();confetti();fanfare();
}
function checkAnswer(toks){
 const v=+toks.map(t=>t.ch).join('');return v;
}
function onAction(a,btnEl){
 audio();
 if(a==='own'){own=true;st='writeProblem';err='';render();clearPad('Skriv t.ex. 7 + 5')}
 else if(a==='gen'){own=false;pickProblem();goGuess()}
 else if(a==='lvl'){S.lvl=+btnEl.dataset.v;save();render()}
 else if(a==='clear'){clearPad()}
 else if(a==='undo'){pad.strokes.pop();drawPad();updateActions()}
 else if(a==='readProblem'){
  const r=readExpression(pad.strokes);
  if(r.err){err=r.err;render();return}
  tokens=r.tokens;sel=tokens.findIndex(t=>t.ch==='?');st='confirmProblem';render();
 }
 else if(a==='rewrite'){
  if(st==='confirmProblem'){st='writeProblem';err='';render();clearPad('Skriv t.ex. 7 + 5')}
  else{st=attempts===0?'guess':(attempts===1?'retry':'copy');msg=st==='guess'?'Vad blir det? Skriv ditt svar med fingret.':(st==='retry'?'Försök igen.':'Skriv '+ANS+' med fingret!');render();clearPad('Skriv svaret här')}
 }
 else if(a==='okProblem'){const p=parseTokens(tokens);if(p.err)return;A=p.a;B=p.b;OP=p.op;ANS=OP==='+'?A+B:A-B;goGuess()}
 else if(a==='readAnswer'){
  const r=readNumber(pad.strokes);
  if(r.err){msg=r.err;$('#panel').querySelector('.msg').textContent=msg;return}
  const v=checkAnswer(r.tokens);
  if(!r.tokens.some(t=>t.ch==='?')&&v===ANS){toRight();return}
  tokens=r.tokens;sel=tokens.findIndex(t=>t.ch==='?');st='confirmAnswer';render();
 }
 else if(a==='okAnswer'){
  const v=checkAnswer(tokens);
  if(v===ANS)toRight();else toWrong(v);
 }
 else if(a==='idk'){toWrong(null)}
 else if(a==='next'){stopAnim();if(own){st='writeProblem';err='';render();clearPad('Skriv t.ex. 7 + 5')}else{pickProblem();goGuess()}}
 else if(a==='home'){stopAnim();st='home';render()}
 else if(a==='how'){V={a:A,b:B,op:OP,k:0,label:A};drawVis();playCount()}
}
$('#panel').addEventListener('click',e=>{
 const k=e.target.closest('[data-k]');
 if(k){
  const v=k.dataset.k;
  if(v==='ok'){sel=-1}
  else if(v==='del'){if(sel>=0){tokens.splice(sel,1);sel=-1}}
  else if(sel>=0){const old=tokens[sel];tokens[sel]={ch:v,low:false};render();if(old&&old.strokes&&old.ch!==v)lesson(old,v);return}
  render();return;
 }
 const c=e.target.closest('.chip');
 if(c){const i=+c.dataset.i;sel=sel===i?-1:i;render();return}
 const b=e.target.closest('[data-a]');if(b)onAction(b.dataset.a,b);
});
$('#actions').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)onAction(b.dataset.a,b)});
$('#b-home').addEventListener('click',()=>onAction('home'));
$('#b-snd').addEventListener('click',()=>{S.snd=!S.snd;save();const b=$('#b-snd');b.textContent=S.snd?'🔊':'🔇';b.setAttribute('aria-label',S.snd?'Ljud på':'Ljud av');b.setAttribute('aria-pressed',String(S.snd));if(S.snd)tone(4)});
document.addEventListener('gesturestart',e=>e.preventDefault());
window.addEventListener('resize',resizeAll);window.addEventListener('orientationchange',()=>setTimeout(resizeAll,200));
/* ===== "Hoppsan"-lektionen: så ritar man tecknet ===== */
const ELL=(cx,cy,rx,ry,a0,a1,n=44)=>{const o=[];for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n;o.push([cx+rx*Math.cos(t),cy+ry*Math.sin(t)])}return o};
const CR=(pts,n=14)=>{
 const q=pts.length,P=[[2*pts[0][0]-pts[1][0],2*pts[0][1]-pts[1][1]],...pts,[2*pts[q-1][0]-pts[q-2][0],2*pts[q-1][1]-pts[q-2][1]]],o=[];
 for(let i=1;i<P.length-2;i++){const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2];for(let j=0;j<n;j++){const t=j/n,t2=t*t,t3=t2*t;o.push([0,1].map(k=>.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)))}}
 o.push(pts[q-1]);return o;
};
const PL=(pts,n=12)=>{const o=[];for(let i=0;i<pts.length-1;i++)for(let j=0;j<n;j++){const t=j/n;o.push([pts[i][0]+(pts[i+1][0]-pts[i][0])*t,pts[i][1]+(pts[i+1][1]-pts[i][1])*t])}o.push(pts[pts.length-1]);return o};
const CAT=(...a)=>[].concat(...a);
const PI=Math.PI;
const GUIDE={
 '0':[ELL(.5,.5,.3,.5,-PI/2,-PI/2-2*PI)],
 '1':[PL([[.28,.25],[.5,0],[.5,1]])],
 '2':[CAT(CR([[.15,.28],[.3,.07],[.62,.03],[.82,.22],[.7,.5],[.12,1]]),PL([[.12,1],[.9,1]]))],
 '3':[CAT(CR([[.15,.15],[.4,0],[.75,.12],[.72,.35],[.4,.48]]),CR([[.4,.48],[.82,.62],[.8,.88],[.5,1],[.12,.88]]))],
 '4':[PL([[.5,0],[.06,.68],[.92,.68]]),PL([[.7,0],[.7,1]])],
 '5':[CAT(PL([[.82,0],[.25,0],[.2,.47]]),CR([[.2,.47],[.5,.38],[.82,.58],[.72,.88],[.4,1],[.1,.9]]))],
 '6':[CR([[.68,0],[.35,.25],[.15,.62],[.2,.9],[.45,1],[.75,.9],[.78,.65],[.5,.52],[.22,.65]])],
 '7':[PL([[.1,0],[.88,0],[.38,1]])],
 '8':[CR([[.5,.48],[.2,.3],[.5,0],[.8,.3],[.5,.48],[.15,.75],[.5,1],[.85,.75],[.5,.48]])],
 '9':[CAT(ELL(.5,.3,.3,.28,0,-2*PI),PL([[.8,.3],[.72,1]]))],
 '+':[PL([[.5,.1],[.5,.9]]),PL([[.1,.5],[.9,.5]])],
 '-':[PL([[.1,.5],[.9,.5]])]
};
const TXT={
 '0':['En 0 är en rund oval, högre än bred, utan hörn.','Börja högst upp. Rita åt vänster, ner, runt och tillbaka dit du började.'],
 '1':['En 1 är ett rakt streck med en liten flagga överst som pekar åt vänster.','Rita en kort flagga snett upp åt höger, och sedan rakt ner.'],
 '2':['En 2 har en rund båge överst och ett rakt streck längst ner.','Rita bågen, gå snett ner åt vänster, och dra sedan ett streck åt höger.'],
 '3':['En 3 är två rundade bågar ovanpå varandra, med öppningen åt vänster.','Rita en liten båge uppe, kom in till mitten, och rita en lite större båge nere.'],
 '4':['En 4 har ett snett streck, ett tvärstreck och ett rakt streck som korsar dem.','Rita snett ner och sedan åt höger. Lyft pennan och rita ett rakt streck ner.'],
 '5':['En 5 har ett rakt streck överst, ett kort streck ner och en rund mage åt höger.','Börja uppe till höger, rita åt vänster och sedan ner. Gör sedan en rund mage åt höger.'],
 '6':['En 6 har en böjd linje som går ner och slutar i en rund ring längst ner.','Börja uppe till höger, böj ner åt vänster och rita en ring nere.'],
 '7':['En 7 har ett vågrätt streck överst och ett snett streck som går ner.','Rita ett streck åt höger och sedan snett ner åt vänster.'],
 '8':['En 8 är två ringar ovanpå varandra, den undre lite större.','Börja i mitten, rita den övre ringen, korsa i mitten och rita den undre ringen.'],
 '9':['En 9 är en liten ring överst med ett rakt streck som går ner från ringens högra sida.','Rita ringen först och gå sedan rakt ner utan att lyfta pennan.'],
 '+':['Ett plus är två streck som korsar varandra mitt i, lika långa.','Rita ett streck ner, lyft pennan och rita ett streck från vänster till höger.'],
 '-':['Ett minus är ett enda vågrätt streck.','Rita ett rakt streck från vänster till höger.']
};
const MIRT={
 '1':'Flaggan överst ska peka åt vänster.','2':'Bågen överst ska bukta åt höger, och strecket längst ner går åt höger.',
 '3':'Båda bågarna ska bukta åt höger, med öppningen åt vänster.','4':'Det sneda strecket ska luta ner åt vänster, och tvärstrecket går åt höger.',
 '5':'Magen ska bukta åt höger, och strecket överst går åt höger.','6':'Ringen sitter nere, och den böjda linjen börjar uppe till höger.',
 '7':'Strecket överst går åt höger, och det sneda strecket kommer ner åt vänster.','9':'Ringen sitter uppe, och det raka strecket går ner på ringens högra sida.'
};
const MIRRORABLE=new Set(['1','2','3','4','5','6','7','9']);
const T={d:'',mode:'demo',t0:0,raf:0,strokes:[],cur:null,w:1,h:1,mirror:false,active:null,done:false};
const tcv=$('#tcv'),tctx=tcv.getContext('2d');
const pathLen=p=>{let l=0;for(let i=1;i<p.length;i++)l+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return l};
function tipName(ch){return ch==='+'?'ett plus':ch==='-'?'ett minus':'en '+ch}
function showTip(ch,opts){
 if(!GUIDE[ch])return;
 T.d=ch;T.mirror=!!(opts&&opts.mirror);T.mode='demo';T.strokes=[];T.cur=null;T.active=null;
 $('#tip-title').textContent=T.mirror?'Hoppsan, din '+ch+':a vänder åt fel håll!':'Hoppsan, sådär ser inte '+tipName(ch)+' ut, i alla fall inte för mig!';
 $('#tip-look').textContent=TXT[ch][0]+(T.mirror&&MIRT[ch]?' '+MIRT[ch]:'');
 $('#tip-how').textContent='Så här ritar man den: '+TXT[ch][1];
 $('#tip-msg').textContent='';tipActions();$('#tip').hidden=false;
 requestAnimationFrame(()=>{sizeTip();playDemo()});
}
function tipActions(){
 $('#tip-act').innerHTML=T.mode==='practice'
  ?'<button data-t="clear">Rensa</button><button data-t="check" class="good">Klar ✓</button>'
  :'<button data-t="again">▶ Visa igen</button><button data-t="try">✍ Prova själv</button>';
}
function sizeTip(){const a=sizeCanvas(tcv,tcv);if(a){T.w=a.w;T.h=a.h}}
function playDemo(){T.mode='demo';T.t0=performance.now();T.done=false;tipActions();cancelAnimationFrame(T.raf);const f=()=>{drawTip();if(!$('#tip').hidden&&T.mode==='demo'&&!T.done)T.raf=requestAnimationFrame(f)};f()}
function drawTip(){
 const c=tctx,w=T.w,h=T.h;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
 const g=GUIDE[T.d];if(!g)return;
 const s=Math.min(h*.84,w*.8),ox=(w-s)/2,oy=(h-s)/2,P=p=>[ox+p[0]*s,oy+p[1]*s];
 c.lineCap='round';c.lineJoin='round';
 const trace=(pts,upto)=>{c.beginPath();pts.slice(0,upto).forEach((p,i)=>{const q=P(p);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1])});c.stroke()};
 c.strokeStyle='#e4dfd2';c.lineWidth=s*.1;g.forEach(p=>trace(p,p.length));
 if(T.mode==='demo'){
  const el=performance.now()-T.t0;let t=el,head=null;
  c.strokeStyle='#2f6fe0';c.lineWidth=s*.07;
  let allDone=true;
  g.forEach(p=>{
   const dur=700+pathLen(p)*900;
   if(t<=0){allDone=false;return}
   if(t>=dur){trace(p,p.length);t-=dur+450;return}
   const k=Math.max(2,Math.round(p.length*t/dur));trace(p,k);head=P(p[Math.min(k,p.length)-1]);allDone=false;t=-1;
  });
  if(allDone&&t>-1)T.done=true;
  if(head){c.fillStyle='#f08a1f';c.beginPath();c.arc(head[0],head[1],s*.055,0,6.283);c.fill()}
 }else{
  c.strokeStyle='#1f2a5a';c.lineWidth=Math.max(6,s*.07);
  for(const st of T.cur?T.strokes.concat([T.cur]):T.strokes){if(st.length===1){c.fillStyle='#1f2a5a';c.beginPath();c.arc(st[0][0],st[0][1],c.lineWidth/2,0,6.283);c.fill();continue}c.beginPath();st.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke()}
 }
 g.forEach((p,i)=>{const q=P(p[0]);c.fillStyle='#17703c';c.beginPath();c.arc(q[0],q[1],s*.05,0,6.283);c.fill();
  if(g.length>1){c.fillStyle='#fff';c.font='700 '+Math.round(s*.07)+'px "Segoe UI",Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(String(i+1),q[0],q[1]+1)}});
}
function tipPoint(e){const r=tcv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
tcv.addEventListener('pointerdown',e=>{if(T.mode!=='practice'||T.active!==null)return;e.preventDefault();audio();T.active=e.pointerId;try{tcv.setPointerCapture(e.pointerId)}catch(_){}T.cur=[tipPoint(e)];drawTip()});
tcv.addEventListener('pointermove',e=>{if(e.pointerId!==T.active||!T.cur)return;e.preventDefault();const p=tipPoint(e),l=T.cur[T.cur.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<2)return;T.cur.push(p);drawTip()});
const tipEnd=e=>{if(e.pointerId!==T.active)return;T.active=null;if(T.cur){T.strokes.push(T.cur);T.cur=null;drawTip()}};
tcv.addEventListener('pointerup',tipEnd);tcv.addEventListener('pointercancel',tipEnd);
function checkPractice(){
 const m=$('#tip-msg');
 if(!T.strokes.length||!T.strokes.some(s=>s.length>1)){m.textContent='Rita först, så tittar jag.';return}
 const f=glyphFeatures(T.strokes),p=netProbs(f),idx=LAB.indexOf(T.d);
 const mirrored=MIRRORABLE.has(T.d)&&mirrorProb(T.strokes,+T.d)>0.8;
 if(p[idx]>=0.5&&!mirrored){m.textContent='Snyggt! Det där är '+tipName(T.d)+'! ⭐';fanfare();confetti();return}
 m.textContent=mirrored?'Nästan! Den vänder fortfarande åt fel håll. Titta en gång till.':'Nästan! Titta en gång till, så provar du igen.';oops();
 T.strokes=[];setTimeout(playDemo,900);
}
function closeTip(){$('#tip').hidden=true;cancelAnimationFrame(T.raf);T.mode='demo'}
$('#tip').addEventListener('click',e=>{
 const b=e.target.closest('[data-t]');if(!b)return;audio();const a=b.dataset.t;
 if(a==='close')closeTip();
 else if(a==='again'){$('#tip-msg').textContent='';playDemo()}
 else if(a==='try'){T.mode='practice';T.strokes=[];T.cur=null;cancelAnimationFrame(T.raf);tipActions();$('#tip-msg').textContent='Rita över den grå siffran. Börja vid den gröna pricken.';drawTip()}
 else if(a==='clear'){T.strokes=[];T.cur=null;$('#tip-msg').textContent='';drawTip()}
 else if(a==='check')checkPractice();
});
window.addEventListener('resize',()=>{if(!$('#tip').hidden){sizeTip();drawTip()}});
function lesson(old,v){
 let mirror=false;
 if(MIRRORABLE.has(v)&&old.strokes&&old.strokes.length)mirror=mirrorProb(old.strokes,+v)>0.8;
 showTip(v,{mirror});
}

$('#b-snd').textContent=S.snd?'🔊':'🔇';
render();resizeAll();
window.__mat={get st(){return st},get tokens(){return tokens},get A(){return A},get B(){return B},get OP(){return OP},get ANS(){return ANS},get attempts(){return attempts},get stars(){return S.stars},
 inject(s){pad.strokes=s;drawPad();updateActions()},get pad(){return pad},
 classify(strokes){const p=netProbs(glyphFeatures(strokes));let b=0;for(let i=1;i<13;i++)if(p[i]>p[b])b=i;return{ch:LAB[b],p:p[b],probs:Array.from(p)}},
 readExpression,readNumber,mirrorProb,showTip,lesson,get T(){return T},GUIDE};
